name = "gomsg"
main = "src/index.ts"
compatibility_date = "2024-05-12"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[durable_objects]
bindings = [
  { name = "GATEWAY_MANAGER", class_name = "GatewayManager" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GatewayManager"]

[triggers]
crons = ["0 */6 * * *"]
